<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <title>Controle Financeiro Doméstico</title>
  <script>
    // GitHub Pages SPA routing — redireciona rotas desconhecidas para index.html
    // preservando o path como query string para que o app possa restaurá-lo.
    // pathSegmentsToKeep = 1 corresponde ao segmento do repositório (/financeiro-domestico).
    var pathSegmentsToKeep = 1;
    var l = window.location;
    l.replace(
      l.protocol + "//" + l.hostname + (l.port ? ":" + l.port : "") +
      l.pathname.split("/").slice(0, 1 + pathSegmentsToKeep).join("/") + "/?/" +
      l.pathname.slice(1).split("/").slice(pathSegmentsToKeep).join("/").replace(/&/g, "~and~") +
      (l.search ? "&" + l.search.slice(1).replace(/&/g, "~and~") : "") +
      l.hash
    );
  </script>
</head>
<body></body>
</html>
