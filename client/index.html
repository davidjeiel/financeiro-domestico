<!doctype html>

  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1" />
    <title>Controle Financeiro Doméstico</title>
    <script>
      // Restaura a rota após o redirect feito pelo 404.html (GitHub Pages SPA routing).
      // O 404.html encoda o path em "?/rota" para que o servidor sirva index.html.
      (function () {
        var l = window.location;
        if (l.search[1] === "/") {
          var decoded = l.search.slice(1).split("&").map(function (s) {
            return s.replace(/~and~/g, "&");
          });
          window.history.replaceState(
            null, null,
            l.pathname.slice(0, -1) +
            decoded[0] +
            (decoded[1] ? "?" + decoded[1] : "") +
            l.hash
          );
        }
      })();
    </script>
